# =============================================================================
# maintenance Module - Schema Index
# =============================================================================
# Version: 2.0
# Description: Module schema index. `module:` and `schema:` are stamped from the
# module name by `metaphor module create`. `schema:` gives this module its OWN
# Postgres schema (migrations emit `CREATE SCHEMA maintenance` and qualify tables
# as `maintenance.<table>`) — the convention every backbone module follows
# (see backbone-sapiens, backbone-bucket). Do not remove it.
# =============================================================================

module: maintenance
version: 2
schema: maintenance

# =============================================================================
# company_fence (ADR-0014): multi-tenant row-level-security posture
# -----------------------------------------------------------------------------
# Posture: shared_blank — nullable company_id on the STAGE master data, NOT NULL
# on every transaction table (the fence vocabulary inventory established).
#
# Per ADR-0014, this declaration governs how the codegen stamps @required company_id
# and how ADR-0015 enforcement hooks ground the three keys (db/both/service) against
# the actual DDL. Posture options:
#   shared_blank  : nullable company_id — NULL rows are first-class shared rows
#                   (the port of Odoo's `[False]` escape). Applies to MASTER DATA.
#   strict        : NOT NULL company_id — every row belongs to exactly one company
#                   and NULL rows are rejected. The `company_id IS NULL` arm of the
#                   shared_blank RLS predicate is dead on these tables, making them
#                   behaviorally strict. Applies to TRANSACTIONS.
#
# Posture map (entity -> realized fence, all under this one declaration):
#   MASTER DATA (shared_blank — nullable company_id, NULL = the one shared set):
#     maintenance_stages   -> shared_blank (Odoo stages are company-agnostic master
#                             data — one stage set serves every company; the seeded
#                             NULL rows ARE that set, visible to every company session)
#   TRANSACTIONS (strict-realized — @required company_id stays NOT NULL, the IS NULL
#   arm of the policy is dead, the existing strict-shaped policies are UNCHANGED):
#     maintenance_schedules  -> strict (policy from 20260426220004_enable_company_rls)
#     maintenance_visits     -> strict (policy from 20260426220004_enable_company_rls)
#     maintenance_visit_parts-> strict (policy from 20260722100000_..._company_rls)
#     maintenance_requests   -> strict (policy from 20260829150000_create_request_family)
#
# Recorded divergence from Odoo (register rows MTF-7/8/9): the module-level fence
# vocabulary offers ONE value per module, and `none` would strip the fence from the
# strict tables, so the closest honest posture is the manufacturing master-data
# pattern (20260901110200_fence_shared_blank_master_data): a nullable company_id
# where the seeded NULL rows are the shared stage set. A per-company stage set is
# POSSIBLE (a row with company_id set is that company's private stage) though
# nothing seeds one; the behavior of the seeded set is identical to Odoo's global
# stages. Odoo's request.company_id is required — maintenance_requests keeps
# @required, so only the stage master escapes the fence.
# -----------------------------------------------------------------------------
company_fence: shared_blank
description: "maintenance domain module"

config:
  database: postgresql
  soft_delete: true
  audit: true
  default_timestamps: true
  generators:
    disabled:
      - graphql
      - grpc
      - proto

# Reuse sapiens for user identity (actors) — logical refs, no DB constraint.
external_imports:
  - module: sapiens
    types: [User]

# Shared value-object types available to all models in this module.
shared_types:
  Timestamps:
    created_at:
      type: datetime
      attributes: ["@default(now)"]
      description: "Record creation timestamp"
    updated_at:
      type: datetime
      attributes: ["@updated_at"]
      description: "Last update timestamp"
    deleted_at:
      type: datetime?
      description: "Soft delete timestamp"

  Actors:
    created_by:
      type: uuid?
      attributes: ["@foreign_key(sapiens.User.id)"]
      description: "User who created this record"
    updated_by:
      type: uuid?
      attributes: ["@foreign_key(sapiens.User.id)"]
      description: "User who last updated this record"
    deleted_by:
      type: uuid?
      attributes: ["@foreign_key(sapiens.User.id)"]
      description: "User who deleted this record"

  Metadata: [Timestamps, Actors]

# Import each entity model. Replace `example` with your real entities.
imports:
  - maintenance_schedule.model.yaml
  - maintenance_visit.model.yaml
  - maintenance_stage.model.yaml
  - maintenance_request.model.yaml
