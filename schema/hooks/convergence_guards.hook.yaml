# =============================================================================
# ConvergenceGuards — write-path guards for the maintenance request family
# (maintenance_requests + maintenance_stages, migration 20260829150000).
#
# Every guard declares its enforcement layer (ADR-0015). The DB arms are the
# raw-SQL backstops: table CHECKs fire on every INSERT/UPDATE regardless of which
# column changed or which layer wrote it, and the two triggers carry the arms a
# CHECK cannot express (they must read the stage table's done flag). The service
# arms are the managed path — the maintenance request write service pre-checks
# and returns typed 4xx errors instead of a DB rejection.
#
# NOT YET IN SCOPE (no referent this pass): G-MT1 (equipment serial unique) and
# G-MT4 (category delete-protect) ride the equipment/category port that does not
# exist — the equipment register is the read-side on asset.Asset. Their register
# rows already carry the citations.
# =============================================================================

name: ConvergenceGuards
model: MaintenanceRequest

rules:
  G-MT2:
    when: [create, update]
    condition: "schedule_end IS NULL OR schedule_date IS NULL OR schedule_end >= schedule_date"
    message: "A request cannot be scheduled to finish before it starts."
    code: request_schedule_end_before_start
    severity: error
    enforcement: both
    enforced_by: "migrations/20260829150000_create_request_family.up.sql::chk_maintenance_requests_schedule_order, src/application/service/maintenance_request_write_service.rs::guard_schedule"
    justification: "DB arm: the CHECK fires on every insert and update whichever column changed. Service arm: the write service refuses first with a typed 422; an update racing another edit reaches the CHECK and answers 500."

  G-MT3:
    when: [create, update]
    condition: "repeat_interval >= 1"
    message: "A recurrence step must be at least one unit."
    code: request_repeat_interval_below_one
    severity: error
    enforcement: both
    enforced_by: "migrations/20260829150000_create_request_family.up.sql::chk_maintenance_requests_repeat_interval_positive, src/application/service/maintenance_request_write_service.rs::guard_repeat_interval"
    justification: "DB arm: the CHECK on maintenance_requests. Service arm: a typed 422 from the write service before the write; a racing update reaches the CHECK and answers 500."

  G-MT7:
    when: [create, update]
    condition: "repeat_type <> 'until' OR repeat_until IS NOT NULL"
    message: "A recurrence bounded 'until' must state its repeat_until date."
    code: request_repeat_until_missing
    severity: error
    enforcement: db
    note: "The citation fence made structural: Odoo accepts repeat_type='until' with a null repeat_until and then silently never spawns (MTB-7, fenced — do not transcribe the latent bug). Here such a request is REJECTED at the DB, never silently non-spawning. The service adds a 422 pre-check for UX; the fence IS the guard."
    enforced_by: "migrations/20260829150000_create_request_family.up.sql::chk_maintenance_requests_repeat_until_required, src/application/service/maintenance_request_write_service.rs::guard_repeat_until"
    justification: "DB arm: the CHECK on maintenance_requests. Service arm: a typed 422 from the write service before the write; a racing update reaches the CHECK and answers 500."

  G-MT8:
    when: [create, update]
    condition: "NOT (maintenance_type = 'corrective' AND recurring)"
    message: "Only preventive maintenance may recur."
    code: request_corrective_cannot_recur
    severity: error
    enforcement: both
    enforced_by: "migrations/20260829150000_create_request_family.up.sql::chk_maintenance_requests_only_preventive_recur, src/application/service/maintenance_request_write_service.rs::guard_recurring"
    justification: "DB arm: the CHECK on maintenance_requests. Service arm: a typed 422 from the write service before the write; a racing update reaches the CHECK and answers 500."

  G-MT5:
    when: [update]
    condition: "a stage transition keeps stage-consistency: kanban_state resets to normal unless the caller set it in the same statement; close_date is stamped on entering a done stage and cleared on leaving; a non-done -> done transition of a preventive recurring request is refused unless it runs through the service verb"
    message: "Stage transitions are trigger-consistent; closing a recurring preventive request requires the managed transition verb."
    code: maintenance_recurring_close_requires_service_verb
    severity: error
    enforcement: both
    justification: "PARTLY: the maintenance_requests_stage_transition trigger refuses a raw close of a recurring preventive request and the transition verb spawns the successor under the managed flag, but the verb decides done-ness from an unlocked read and its compare-and-set does not pin the old stage, so a concurrent stage move can close without a successor; a request created straight into a done stage, or left on a stage whose done flag is later set, never spawns; and an explicit kanban state equal to the current one is still reset."

  G-MT6:
    when: [soft_delete]
    entity: MaintenanceStage
    condition: "no live maintenance_requests row (metadata->>'deleted_at' IS NULL) references the stage"
    message: "A stage referenced by live requests cannot be deleted."
    code: maintenance_stage_in_use
    severity: error
    enforcement: db
    note: "The honest G-MT4 analog (G-MT4 itself guards an equipment CATEGORY delete, and no category entity exists this pass). Hard DELETE is blocked by the stage FK (ON DELETE RESTRICT); SOFT delete (metadata->>'deleted_at' set) of a referenced stage is blocked by a BEFORE UPDATE trigger on maintenance_stages raising maintenance_stage_in_use."
    justification: "PARTLY: the maintenance_stages_soft_delete_guard trigger refuses soft-deleting a stage with live requests and the stage foreign key refuses a hard delete, but a create or transition racing the delete can still land a request on the stage, the refusal answers 500 rather than maintenance_stage_in_use, and the guard sees requests of every unit only when its owner bypasses row security."

  G-MT_STAGE_FK:
    when: [create, update]
    condition: "maintenance_requests.stage_id references an existing maintenance_stages row"
    message: "The stage foreign key is real, ON DELETE RESTRICT."
    code: request_stage_fk
    severity: error
    enforcement: db
    note: "In-module REAL FK (the ondelete=restrict analog) — raw-SQL safe by construction: an insert or update pointing at a missing stage raises the FK violation."
    enforced_by: "migrations/20260829150000_create_request_family.up.sql::fk_maintenance_requests_stage_id"
    justification: "The foreign key refuses a request naming a missing stage on every path; the service answers a missing stage as not found, a raw violation answers 500, and the key does not see soft deletion."

# Scheduled jobs: NONE. The request family's recurrence is the clone-on-done
# engine inside the transition transaction — zero crons is a hard invariant of
# this module family (ADR-0020: any future job would need a declared posture;
# this pass expects none).
