server:
  host: 0.0.0.0
  port: 8080
  grpc_port: 50051
database:
  url: postgresql://root:password@localhost:5432/skeletondb
  max_connections: 10
  min_connections: 5
  connect_timeout: 30
  idle_timeout: 600
logging:
  level: info
  format: json
  file: logs/maintenance.log
module:
  name: maintenance
  enabled: true
features:
  soft_delete: true
  state_machines: false
  workflows: true
entities:
  maintenance_schedule:
    collection: maintenance_schedules
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  maintenance_visit:
    collection: maintenance_visits
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  maintenance_visit_part:
    collection: maintenance_visit_parts
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  maintenance_request:
    collection: maintenance_requests
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  maintenance_stage:
    collection: maintenance_stages
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
tracing:
  enabled: true
  exporter: otlp
  endpoint: http://localhost:4317
metrics:
  enabled: true
  endpoint: /metrics
  port: 9090
